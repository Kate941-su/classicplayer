name: android

on:
  # main の必須チェックにできるよう、パスで絞らずすべての PR で実行する
  pull_request:
  push:
    branches: [main]
    paths: ["android/**", "fixtures/**", "schema/**", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: ビルド・テスト・lint・detekt
        run: ./gradlew assembleDebug test lint detekt --console=plain
      - name: レポートを保存（失敗時）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: android/**/build/reports/
          retention-days: 7
