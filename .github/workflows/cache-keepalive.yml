# Actions のキャッシュは 7 日間使われないと消える。月次の巡回（catalog.yml）で差分取得できるよう、
# 週 1 回 HTML キャッシュを読み込んで残す。CMSL には接続しない。
name: cache-keepalive

on:
  schedule:
    - cron: "41 4 * * 1"   # 毎週月曜 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: catalog/cache
          key: cmsl-html-keepalive-never-matches
          restore-keys: cmsl-html-
      - run: |
          echo "復元したキャッシュ: ${{ steps.restore.outputs.cache-matched-key || 'なし' }}"
          find catalog/cache -type f 2>/dev/null | wc -l
