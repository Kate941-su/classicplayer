name: catalog-test

on:
  # main の必須チェックなので、パスで絞らずすべての PR で実行する（数秒で終わる）
  pull_request:
  push:
    branches: [main]
    paths: ["catalog/**", "schema/**", "fixtures/**", "site/v1/**"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r catalog/requirements-dev.txt
      - run: python -m pytest -q catalog
      # build_catalog.py は標準ライブラリだけで動くこと（オーナーが素の Python で実行するため）
      - name: 依存なしの venv で実行
        run: |
          python -m venv "$RUNNER_TEMP/bare"
          "$RUNNER_TEMP/bare/bin/python" catalog/tests/test_build_catalog.py > /dev/null
      # 公開するカタログ（site/v1/）を、いま公開中の manifest と比べる（曲数が 10% 以上減っていたら失敗。SPEC §3.1）。
      # 公開中のものがまだなければ（初回）比べない。検証そのものは pytest の test_site_catalog.py
      - name: 公開中のカタログからの曲数の減少
        if: hashFiles('site/v1/catalog.json') != ''
        run: |
          curl -fsSL https://kate941-su.github.io/classicplayer/v1/manifest.json -o "$RUNNER_TEMP/published.json" \
            || { echo "公開中の manifest はまだない"; rm -f "$RUNNER_TEMP/published.json"; }
          python catalog/validate_catalog.py site/v1/catalog.json --previous-manifest "$RUNNER_TEMP/published.json"
