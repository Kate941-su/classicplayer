# GitHub Pages を更新する（site/ のプライバシーポリシー・サポートと、カタログ site/v1/*.json）。
# カタログはオーナーが手元で巡回して PR でコミットする（tool/update-catalog.sh。PLAN 0.7、SPEC §3.1）。
# GitHub Actions からは CMSL を巡回できない（robots.txt の判定で全面禁止になる）ので、ここでは巡回しない。
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "schema/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r catalog/requirements-dev.txt
      # PR の catalog-test でも検証しているが、公開する直前にもう一度確かめる
      - name: 公開するカタログを検証
        run: python -m pytest -q catalog/tests/test_site_catalog.py
      - name: 公開するファイルをまとめる
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp schema/catalog.schema.json schema/manifest.schema.json _site/v1/
          find _site -name .gitkeep -delete
          find _site -type f | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
