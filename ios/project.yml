# XcodeGen の定義（正本）。変更したら `cd ios && xcodegen` で CMSLClassical.xcodeproj を作り直してコミットする。
name: CMSLClassical
options:
  bundleIdPrefix: app.cmsl
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  knownRegions: [ja, en, Base]
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CMSLClassical:
    type: application
    platform: iOS
    sources:
      - path: CMSLClassical
    info:
      path: CMSLClassical/Info.plist
      properties:
        CFBundleDisplayName: クラシック名曲
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        CFBundleAllowMixedLocalizations: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # バックグラウンド再生（SPEC §5）
        UIBackgroundModes: [audio]
        # 旧サーバー 3 つだけ http を許可する（SPEC §1.2・§8.1）。NSAllowsArbitraryLoads は使わない
        NSAppTransportSecurity:
          NSExceptionDomains:
            classical-music.aki.gs:
              NSExceptionAllowsInsecureHTTPLoads: true
            andotowa.sakura.ne.jp:
              NSExceptionAllowsInsecureHTTPLoads: true
            classical-music.sakura.ne.jp:
              NSExceptionAllowsInsecureHTTPLoads: true
    postCompileScripts:
      # 同梱カタログ（シード。SPEC §2・§6）を catalog.json としてアプリに入れる。Android と同じく
      # android/seed/catalog.json（tool/update-seed.sh）があればそれ、なければ fixtures/catalog.sample.json。
      # ビルド設定 CMSL_SEED_CATALOG=<path> で差し替えられる（tool/run.sh ios --seed）
      - name: Copy seed catalog
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          src="${CMSL_SEED_CATALOG:-}"
          if [[ -z "$src" ]]; then
            src="$SRCROOT/../android/seed/catalog.json"
            [[ -f "$src" ]] || src="$SRCROOT/../fixtures/catalog.sample.json"
          fi
          [[ -f "$src" ]] || { echo "error: シードのカタログがありません: $src"; exit 1; }
          res="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          cp "$src" "$res/catalog.json"
          # シードの作曲家の肖像画（SPEC §4.10・§6）を portraits/ に入れる。Android のビルドと同じく
          # android/seed/portraits/（tool/update-seed.sh）→ site/v1/portraits/ の順に探し、sha256 が合うものだけ
          rm -rf "$res/portraits"
          mkdir -p "$res/portraits"
          /usr/bin/python3 -I - "$src" "$res/portraits" "$SRCROOT/../android/seed/portraits" "$SRCROOT/../site/v1/portraits" <<'PY'
          import hashlib, json, pathlib, shutil, sys
          catalog, out, *dirs = sys.argv[1:]
          n, missing = 0, []
          for c in json.loads(pathlib.Path(catalog).read_text(encoding="utf-8"))["composers"]:
              p = c.get("portrait")
              if not p or p["url"] != f"portraits/{c['id']}.jpg":
                  continue
              name = f"{c['id']}.jpg"
              for d in dirs:
                  f = pathlib.Path(d) / name
                  if f.is_file() and hashlib.sha256(f.read_bytes()).hexdigest() == p["sha256"]:
                      shutil.copyfile(f, pathlib.Path(out) / name)
                      n += 1
                      break
              else:
                  missing.append(name)
          print(f"同梱の肖像画: {n} 枚" + (f"（見つからない・sha256 が違う: {', '.join(missing)}）" if missing else ""))
          PY
    settings:
      base:
        # シードのコピー（リポジトリ内の任意のパスを読む）のためにスクリプトのサンドボックスを外す
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_NAME: CMSLClassical
        PRODUCT_BUNDLE_IDENTIFIER: app.cmsl.classical
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # 実機で動かすときの開発チーム（Apple の Team ID。署名済みのアプリに含まれるもので秘密ではない）
        DEVELOPMENT_TEAM: WATT786F4L
        GENERATE_INFOPLIST_FILE: NO
  CMSLClassicalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CMSLClassicalTests
      # 共有フィクスチャを参照で入れる（コピーしない）。バンドル内では fixtures/ にある
      - path: ../fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: CMSLClassical
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cmsl.classical.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CMSLClassical.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CMSLClassical
        BUNDLE_LOADER: $(TEST_HOST)
  CMSLClassicalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CMSLClassicalUITests
    dependencies:
      - target: CMSLClassical
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cmsl.classical.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CMSLClassical
schemes:
  CMSLClassical:
    build:
      targets:
        CMSLClassical: all
        CMSLClassicalTests: [test]
        CMSLClassicalUITests: [test]
    test:
      targets:
        - CMSLClassicalTests
        - CMSLClassicalUITests
