# XcodeGen の定義（正本）。変更したら `cd ios && xcodegen` で CMSLClassical.xcodeproj を作り直してコミットする。
name: CMSLClassical
options:
  bundleIdPrefix: app.cmsl
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  knownRegions: [ja, en, Base]
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CMSLClassical:
    type: application
    platform: iOS
    sources:
      - path: CMSLClassical
    info:
      path: CMSLClassical/Info.plist
      properties:
        CFBundleDisplayName: クラシック名曲
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        CFBundleAllowMixedLocalizations: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # バックグラウンド再生（SPEC §5）
        UIBackgroundModes: [audio]
        # 旧サーバー 3 つだけ http を許可する（SPEC §1.2・§8.1）。NSAllowsArbitraryLoads は使わない
        NSAppTransportSecurity:
          NSExceptionDomains:
            classical-music.aki.gs:
              NSExceptionAllowsInsecureHTTPLoads: true
            andotowa.sakura.ne.jp:
              NSExceptionAllowsInsecureHTTPLoads: true
            classical-music.sakura.ne.jp:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_NAME: CMSLClassical
        PRODUCT_BUNDLE_IDENTIFIER: app.cmsl.classical
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  CMSLClassicalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CMSLClassicalTests
      # 共有フィクスチャを参照で入れる（コピーしない）。バンドル内では fixtures/ にある
      - path: ../fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: CMSLClassical
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cmsl.classical.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CMSLClassical.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CMSLClassical
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  CMSLClassical:
    build:
      targets:
        CMSLClassical: all
        CMSLClassicalTests: [test]
    test:
      targets:
        - CMSLClassicalTests
